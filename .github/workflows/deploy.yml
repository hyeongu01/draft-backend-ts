name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  version-validation:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fail if version tag already exists
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/draft-backend:${{ steps.pkg.outputs.version }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::$IMAGE 가 이미 존재합니다. package.json 의 version 을 올리세요."
            exit 1
          fi
          echo "$IMAGE 없음 → 빌드 진행"

  build-and-push:
    runs-on: ubuntu-latest
    needs: version-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU # 다른 아키텍쳐 빌드 에뮬레이터
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/draft-backend:${{ needs.version-validation.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/draft-backend:latest
