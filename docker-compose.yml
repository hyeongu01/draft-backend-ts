services:
  api:
    image: ghcr.io/hyeongu01/draft-backend:latest
    container_name: draft-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/draftDB?allowPublicKeyRetrieval=true"

    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4
    container_name: draft-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: draftDB

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
